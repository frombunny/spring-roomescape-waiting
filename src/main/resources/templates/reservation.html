<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomescape</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="page page-reservation">
<main class="shell">
    <nav class="service-nav" aria-label="주요 메뉴">
        <a class="brand" href="/reservation">ROOMESCAPE</a>
        <div class="nav-links">
            <a class="active" href="/reservation">테마</a>
            <a href="/reservation/new">예약</a>
            <a href="/reservation/me">내 예약</a>
            <a href="/admin">관리자</a>
        </div>
    </nav>

    <section class="hero storefront-hero">
        <div class="hero-copy">
            <p class="eyebrow">Roomescape Club</p>
            <h1>방탈출 테마</h1>
            <p class="hero-text">
                원하는 테마를 고르고 바로 예약하세요.
            </p>
            <div class="hero-actions">
                <a class="button primary" href="/reservation/new">예약 시작</a>
                <a class="button ghost" href="/reservation/me">내 예약 확인</a>
            </div>
        </div>
        <div class="hero-panel">
            <a class="flow-step current" href="/reservation">
                <span>01</span>
                <strong>테마 탐색</strong>
            </a>
            <a class="flow-step" href="/reservation/new">
                <span>02</span>
                <strong>날짜와 시간 선택</strong>
            </a>
            <a class="flow-step" href="/reservation/me">
                <span>03</span>
                <strong>예약 확인</strong>
            </a>
        </div>
    </section>

    <section id="popular-themes" class="page-section">
        <div class="section-heading">
            <div>
                <p class="eyebrow">Weekly Top 10</p>
                <h2>최근 1주일 인기 테마</h2>
            </div>
            <a class="text-link" href="/reservation/new">예약하기</a>
        </div>

        <div class="theme-grid compact">
            <article class="theme-card compact" th:each="theme : ${popularThemes}">
                <a th:href="@{/reservation/new(themeId=${theme.id})}">
                    <img th:src="${theme.thumbnailImageUrl}" th:alt="${theme.name}" loading="lazy" onerror="this.src='/images/themes/default.svg'">
                    <div class="theme-card-body">
                        <div class="theme-card-head">
                            <strong th:text="${theme.name}">인기 테마</strong>
                        </div>
                        <p th:text="${theme.description}">설명</p>
                    </div>
                </a>
            </article>
            <div class="empty-card" th:if="${#lists.isEmpty(popularThemes)}">
                최근 1주일 예약 데이터가 아직 없습니다.
            </div>
        </div>
    </section>

    <section class="page-section">
        <div class="section-heading">
            <div>
                <p class="eyebrow">Themes</p>
                <h2>전체 테마</h2>
            </div>
        </div>

        <div class="theme-grid catalog-grid">
            <article class="theme-card" th:each="theme : ${themes}">
                <a th:href="@{/reservation/new(themeId=${theme.id})}">
                    <img th:src="${theme.thumbnailImageUrl}" th:alt="${theme.name}" loading="lazy" onerror="this.src='/images/themes/default.svg'">
                    <div class="theme-card-body">
                        <div class="theme-card-head">
                            <strong th:text="${theme.name}">미드나잇 시그널</strong>
                        </div>
                        <p th:text="${theme.description}">설명</p>
                        <span class="card-link">예약 가능 시간 보기</span>
                    </div>
                </a>
            </article>
            <div class="empty-card" th:if="${#lists.isEmpty(themes)}">
                등록된 테마가 없습니다. 관리자 페이지에서 먼저 테마를 추가하세요.
            </div>
        </div>
    </section>
</main>
</body>
</html>
