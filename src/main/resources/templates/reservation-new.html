<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomescape Reservation</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="page page-reservation">
<main class="shell">
    <nav class="service-nav" aria-label="주요 메뉴">
        <a class="brand" href="/reservation">ROOMESCAPE</a>
        <div class="nav-links">
            <a href="/reservation">테마</a>
            <a class="active" href="/reservation/new">예약</a>
            <a href="/reservation/me">내 예약</a>
            <a href="/admin">관리자</a>
        </div>
    </nav>

    <section class="page-hero">
        <div>
            <p class="eyebrow">Reservation</p>
            <h1>예약하기</h1>
        </div>
        <a class="button ghost" href="/reservation">테마 다시 보기</a>
    </section>

    <section class="booking-layout">
        <aside class="flow-panel">
            <a class="flow-step done" href="/reservation">
                <span>01</span>
                <strong>테마 탐색</strong>
            </a>
            <a class="flow-step current" href="/reservation/new">
                <span>02</span>
                <strong>예약 정보 입력</strong>
            </a>
            <a class="flow-step" href="/reservation/me">
                <span>03</span>
                <strong>예약 확인</strong>
            </a>
        </aside>

        <section class="panel">
            <div class="panel-header">
                <p class="eyebrow">Book Now</p>
                <h2>예약 만들기</h2>
            </div>

            <div id="reservation-feedback" class="feedback" hidden></div>

            <form id="reservation-form" class="stack-form">
                <label class="field">
                    <span>예약자 이름</span>
                    <input id="reservation-name" name="name" type="text" placeholder="예: 포비" required>
                </label>

                <label class="field">
                    <span>예약 날짜</span>
                    <input id="reservation-date" name="date" type="date" th:value="${today}" th:attr="min=${today}" required>
                </label>

                <label class="field">
                    <span>테마 선택</span>
                    <select id="theme-select" name="themeId" required>
                        <option value="">테마를 선택하세요</option>
                        <option th:each="theme : ${themes}"
                                th:value="${theme.id}"
                                th:text="${theme.name}">
                            미드나잇 시그널
                        </option>
                    </select>
                </label>

                <div class="field">
                    <span>예약 시간</span>
                    <div id="availability-summary" class="hint">날짜와 테마를 선택하면 확정/대기 가능 시간이 표시됩니다.</div>
                    <div id="available-times" class="time-grid empty-state">
                        아직 조회된 시간이 없습니다.
                    </div>
                </div>

                <button id="reservation-submit" class="button primary" type="submit" disabled>예약 신청</button>
            </form>
        </section>

        <aside class="panel summary-panel">
            <p class="eyebrow">Selected</p>
            <div id="selected-summary" class="selected-summary">
                <strong>예약 정보를 선택하세요.</strong>
                <span>테마와 날짜를 고르면 요약이 표시됩니다.</span>
            </div>
        </aside>
    </section>
</main>
<script th:src="@{/js/reservation-new-page.js}"></script>
</body>
</html>
